spring.application.name=api-gateway
server.port=9000


# ============================================================
# ACTUATOR
# ============================================================

management.endpoint.health.show-details=always

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.health.circuitbreakers.enabled=true

management.metrics.tags.application=${spring.application.name}


# ============================================================
# RESILIENCE4J - CIRCUIT BREAKER
# ============================================================

# Register circuit breakers with Actuator health
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

# Count-based sliding window
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED

# Number of calls stored in sliding window
resilience4j.circuitbreaker.configs.default.slidingWindowSize=8

# Circuit opens when failure rate reaches 20%
resilience4j.circuitbreaker.configs.default.failureRateThreshold=20

# Minimum number of calls before failure rate is calculated
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=4

# Time circuit remains OPEN
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s

# Number of calls allowed when HALF_OPEN
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2

# Automatically move OPEN -> HALF_OPEN
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true


# ============================================================
# KEYCLOAK
# ============================================================

keycloak.auth.jwk-set-uri=http://localhost:8091/realms/het-security-realm/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8091/realms/het-security-realm


# ============================================================
# SECURITY
# ============================================================

security.excluded.urls=/actuator/**,/swagger-ui.html,/swagger-ui/**,/docs/**,/v3/api-docs/**,/swagger-resources/**,/api-docs/**


# ============================================================
# OPENAPI / SWAGGER
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs


# User Service Swagger
springdoc.swagger-ui.urls[0].name=User Service

springdoc.swagger-ui.urls[0].url=/docs/user-service/v3/api-docs


# Device Service Swagger
springdoc.swagger-ui.urls[1].name=Device Service

springdoc.swagger-ui.urls[1].url=/docs/device-service/v3/api-docs
